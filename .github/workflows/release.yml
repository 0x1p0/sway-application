name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build without signing secrets
    if: github.repository == '0x1p0/sway-application'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release source
        run: |
          bash scripts/release-version.sh "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -s "releases/$GITHUB_REF_NAME.md"
      - name: Test without secrets or write permissions
        run: |
          bash scripts/test-gestures.sh
          bash scripts/test-settings.sh
          bash scripts/test-haptics.sh
          bash scripts/test-updates.sh
          bash scripts/test-update-signing.sh
          bash scripts/test-presentation.sh
          bash scripts/test-audio.sh
          bash scripts/test-brightness.sh
          bash scripts/test-controls.sh
          ruby Tests/runtime_verification_regressions.rb
          ruby Tests/release_policy_regressions.rb
      - name: Build and verify hardened universal ZIP and DMG
        run: |
          SWAY_DEFER_UPDATE_SIGNING=1 bash scripts/package-release.sh "$GITHUB_REF_NAME"
          bash scripts/test-updater-bundle.sh
      - name: Hand off data, never signing tools
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-${{ github.sha }}
          path: build/releases/${{ github.ref_name }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Approve, sign, and publish
    needs: build
    runs-on: macos-26
    timeout-minutes: 15
    environment:
      name: release
      url: https://github.com/0x1p0/sway-application/releases
    permissions:
      contents: write
    steps:
      # No caches or executables from the build runner cross this boundary.
      # Signing code comes from protected main, never from an artifact.
      - name: Check out trusted signing source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require the approved tag to be current main
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version="$(bash scripts/release-version.sh "$GITHUB_REF_NAME")"
          test -s "releases/$GITHUB_REF_NAME.md"
          printf 'SWAY_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Compile trusted dependency-free signing tools
        run: |
          xcrun swiftc -swift-version 5 -warnings-as-errors scripts/sign-update.swift -o "$RUNNER_TEMP/sway-sign-update"
          xcrun swiftc -swift-version 5 -warnings-as-errors scripts/verify-update-feed.swift -o "$RUNNER_TEMP/sway-verify-update"
      - name: Download only this build's artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/sway-release
          merge-multiple: true
          digest-mismatch: error
      - name: Sign opaque archives after approval
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { printf 'Protected release signing key is missing.\n' >&2; exit 1; }
          "$RUNNER_TEMP/sway-sign-update" "$RUNNER_TEMP/sway-release" Sway/Info.plist "releases/$GITHUB_REF_NAME.md" "$GITHUB_REF_NAME"
      - name: Independently verify signatures and checksums
        run: |
          "$RUNNER_TEMP/sway-verify-update" "$RUNNER_TEMP/sway-release/appcast.xml" "$RUNNER_TEMP/sway-release/Sway-$SWAY_VERSION-macos-universal.zip" Sway/Info.plist
          cd "$RUNNER_TEMP/sway-release"
          shasum -a 256 -c SHA256SUMS.txt
      - name: Publish complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/sway-release/Sway-$SWAY_VERSION-macos-universal.zip" \
            "$RUNNER_TEMP/sway-release/Sway-$SWAY_VERSION-macos-universal.dmg" \
            "$RUNNER_TEMP/sway-release/SHA256SUMS.txt" \
            "$RUNNER_TEMP/sway-release/appcast.xml" \
            --verify-tag --draft \
            --title "Sway $SWAY_VERSION" \
            --notes-file "releases/$GITHUB_REF_NAME.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
